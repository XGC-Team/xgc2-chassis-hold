name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hold-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build-debs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-xrpc
          ref: f8a9258f7d3c395ccdef27405cccadceb794884c
          path: _dependencies/xrpc
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-state-machine
          ref: 846a75c798b8722d7b5af7d569378e092340dc19
          path: _dependencies/state-machine
      - name: Build and install native SDK and HOLD packages
        run: |
          mkdir -p .ci
          docker run --rm --network none \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/.ci:/repo/.ci" \
            -v "$GITHUB_WORKSPACE/_dependencies:/dependencies" -v "$RUNNER_TEMP:/scratch" \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic@sha256:fce2d76fddf4f6439bf0a188249b731650febdc163befc360bed186b269d252a \
            bash -lc 'set -euo pipefail; trap "chown -R $HOST_UID:$HOST_GID /repo/.ci /dependencies /scratch/chassis-hold" EXIT; git config --global --add safe.directory "*"; /repo/.xgc2/scripts/build-ci.sh /scratch/chassis-hold /dependencies'
      - name: Create strict source-bound build manifest
        run: |
          version="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir .ci/debs --output-dir .ci/build-manifests \
            --product libxgc2-chassis-hold-dev --product-version "$version" \
            --distribution focal --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: libxgc2-chassis-hold-dev-debs-${{ matrix.arch }}
          path: |
            .ci/debs/*.deb
            .ci/build-manifests/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
