name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hold-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build-debs:
    name: build-debs (${{ matrix.distribution }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distribution: bionic, arch: amd64, runner: ubuntu-24.04, platform: linux/amd64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0"}
          - {distribution: bionic, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0"}
          - {distribution: focal, arch: amd64, runner: ubuntu-24.04, platform: linux/amd64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0"}
          - {distribution: focal, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0"}
          - {distribution: jammy, arch: amd64, runner: ubuntu-24.04, platform: linux/amd64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0"}
          - {distribution: jammy, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0"}
          - {distribution: noble, arch: amd64, runner: ubuntu-24.04, platform: linux/amd64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0"}
          - {distribution: noble, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0"}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned XRPC revision
        id: xrpc
        run: echo "ref=$(tr -d '[:space:]' < .xgc2/xrpc.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-xrpc
          ref: ${{ steps.xrpc.outputs.ref }}
          path: _dependencies/xrpc
      - name: Build, test, package and run the tests against the installed packages
        run: |
          mkdir -p .ci
          docker run --rm --platform "${{ matrix.platform }}" \
            -e PACKAGE_DISTRIBUTION="${{ matrix.distribution }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/.ci:/repo/.ci" \
            -v "$GITHUB_WORKSPACE/_dependencies:/dependencies" -v "$RUNNER_TEMP:/scratch" \
            "${{ matrix.image }}" \
            bash -lc 'set -euo pipefail; trap "chown -R $HOST_UID:$HOST_GID /repo/.ci /dependencies /scratch/chassis-hold" EXIT; git config --global --add safe.directory "*"; /repo/.xgc2/scripts/build-ci.sh /scratch/chassis-hold /dependencies'
      - name: Create strict source-bound build manifest
        run: |
          version="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir .ci/debs --output-dir .ci/build-manifests \
            --product libxgc2-chassis-hold-dev --product-version "$version" \
            --distribution "${{ matrix.distribution }}" --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: libxgc2-chassis-hold-dev-debs-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            .ci/debs/*.deb
            .ci/build-manifests/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned XRPC revision
        id: xrpc
        run: echo "ref=$(tr -d '[:space:]' < .xgc2/xrpc.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-xrpc
          ref: ${{ steps.xrpc.outputs.ref }}
          path: _dependencies/xrpc
      - name: Lower address-space randomization for the sanitizer runtimes
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: ThreadSanitizer, then AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          docker run --rm --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            -e PACKAGE_DISTRIBUTION=noble \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/_dependencies:/dependencies:ro" \
            -v "$RUNNER_TEMP:/scratch" \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0 \
            bash -lc 'set -euo pipefail; git config --global --add safe.directory "*"; /repo/.xgc2/scripts/run-sanitizers.sh /scratch/sanitizers /dependencies'
